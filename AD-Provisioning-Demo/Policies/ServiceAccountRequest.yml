policyRules:  
  - requestType: ServiceAccountRequest
    steps:
      - role: ResourceOwner
        selector: ResourceOwnerOf(ServiceAccount)
      - role: PlatformOwner
        selector: PlatformOwner()
    rules:
      - name: DescriptionMustContainApplicationName
        description: The 'description' attribute must include the value of the 'appname' attribute.
        condition: "'{{description}}' must contain '{{appname}}'"
